# Casino Clone — CI/CD pipeline.
# Copy to .github/workflows/ci.yml at the repo root to activate.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, typecheck, build, test ──
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: casino
          POSTGRES_DB: casino_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casino" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://casino:casino@localhost:5432/casino_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long-xxxxx
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long-xxxx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build game-engine (consumed by backend)
        run: npm run engine:build
      - name: Typecheck
        run: npm run typecheck
      - name: Build all workspaces
        run: npm run build
      - name: Test
        run: npm test --if-present

  # ── Build & push container images (main only) ──
  docker:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push node-services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/node-services:latest,ghcr.io/${{ github.repository }}/node-services:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          build-args: APP=frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          build-args: APP=admin-panel
          push: true
          tags: ghcr.io/${{ github.repository }}/admin-panel:latest

  # ── Deploy (placeholder — wire to your host/orchestrator) ──
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "Pull new images and 'docker compose up -d' on the target host."
          echo "e.g. via SSH (appleboy/ssh-action) or your orchestrator's rollout."
