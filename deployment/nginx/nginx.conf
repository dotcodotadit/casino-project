# Edge reverse proxy — TLS termination + routing for the whole platform.
#   player app   →  https://<domain>/            → frontend container
#   admin panel  →  https://admin.<domain>/       → admin-panel container
#   REST API     →  https://<domain>/api/         → api-gateway
#   websockets   →  https://<domain>/socket.io/   → backend (Socket.io)
#
# SSL certs are mounted at /etc/nginx/certs (fullchain.pem + privkey.pem).
# See deployment/scripts/gen-ssl.sh (self-signed) or use certbot/Let's Encrypt.

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Structured access logs (JSON) for log shippers.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Body / timeouts.
  client_max_body_size 2m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  # WebSocket upgrade mapping.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Upstreams (docker service names).
  upstream gateway_up  { server api-gateway:8080; }
  upstream backend_up  { server backend:4000; }
  upstream frontend_up { server frontend:80; }
  upstream admin_up    { server admin-panel:80; }

  # ── HTTP :80 — ACME challenge + redirect to HTTPS ──
  server {
    listen 80;
    server_name _;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # Shared proxy headers.
  # (Defined as a snippet via map-free repetition below.)

  # ── HTTPS :443 — player app + API + sockets ──
  server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # REST API → gateway (full /api/* path preserved).
    location /api/ {
      proxy_pass http://gateway_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets → backend (Socket.io).
    location /socket.io/ {
      proxy_pass http://backend_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
    }

    # Everything else → player SPA.
    location / {
      proxy_pass http://frontend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── HTTPS :443 — admin panel on its own subdomain ──
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.${DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;

    # Admin shares the same API gateway.
    location /api/ {
      proxy_pass http://gateway_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://admin_up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
